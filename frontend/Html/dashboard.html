<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel Dashboard</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <main class="dashboard">
        <header class="dashboard-header">
            <p class="eyebrow">SENTINEL SECURITY PLATFORM</p>
            <h1>Secret Exposure Scanner</h1>
            <p>
                Detect exposed credentials, API keys, passwords, and private keys.
            </p>
        </header>

        <section class="scanner-panel">
            <label for="source-code">Source code to scan</label>

            <textarea
                id="source-code"
                placeholder="Paste source code or configuration here..."
                rows="12"
            ></textarea>

            <button id="scan-button">Scan for secrets</button>

            <p id="scan-status" aria-live="polite"></p>
        </section>

        <section class="results-panel">
            <h2>Scan Results</h2>
            <div class="summary-cards">
    <div class="summary-card total">
        <span>Total Findings</span>
        <strong id="total-count">0</strong>
    </div>

    <div class="summary-card critical">
        <span>Critical</span>
        <strong id="critical-count">0</strong>
    </div>

    <div class="summary-card high">
        <span>High</span>
        <strong id="high-count">0</strong>
    </div>

    <div class="summary-card medium">
        <span>Medium</span>
        <strong id="medium-count">0</strong>
    </div>

    <div class="summary-card low">
        <span>Low</span>
        <strong id="low-count">0</strong>
    </div>
</div>

<div id="results"></div>
                <p>No scan performed yet.</p>
            </div>
        </section>
    </main>

    <script src="../javascript/app.js"></script>
</body>
</html>
